<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>bebselris ♡ Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      /* โทนขาว-ดำพาสเทล ละมุนตา */
      --bg-color: #f7f7f8;
      --card-bg: rgba(255, 255, 255, 0.94);
      --pastel-dark: #3a3a3e;
      --pastel-gray: #71717a;
      --pastel-light-gray: #e4e4e7;
      --border-soft: #ececf0;
      --btn-charcoal: #27272a;
      --glow-shadow: 0 10px 28px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #ffffff 0%, #f4f4f6 60%, #ebebef 100%);
      color: var(--pastel-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Emojis (☁️ 🩶 🎱) */
    .floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -60px;
      font-size: 22px;
      animation: floatUp 12s linear infinite;
      opacity: 0.65;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.12));
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.75; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      position: relative;
      z-index: 2;
    }

    /* Profile Box */
    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 30px;
      padding: 12px 14px 22px;
      box-shadow: var(--glow-shadow);
      border: 2px solid #ffffff;
      text-align: center;
      margin-bottom: 16px;
    }

    .banner-container {
      width: 100%;
      height: 140px;
      border-radius: 22px;
      overflow: hidden;
      background: #f0f0f2;
      border: 1px solid #ffffff;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-wrap {
      position: relative;
      margin-top: -46px;
      display: inline-block;
    }

    .profile-img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      background: #ffffff;
    }

    .store-name {
      font-size: 19px;
      font-weight: 700;
      color: var(--pastel-dark);
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    .bio-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--pastel-gray);
      white-space: pre-line;
      margin-top: 6px;
      padding: 0 10px;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      padding: 9px 20px;
      border-radius: 20px;
      background: #ffffff;
      border: 1.5px solid var(--pastel-light-gray);
      color: var(--pastel-dark);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }

    .contact-btn:active {
      transform: scale(0.97);
      background: #fafafa;
    }

    /* Section Grid Posts */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 26px;
      padding: 18px 14px;
      box-shadow: var(--glow-shadow);
      border: 2px solid #ffffff;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--pastel-dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 2px;
    }

    /* ตารางโพสต์แบบ Instagram: สี่เหลี่ยมจัตุรัสเล็ก ๆ 3 ช่อง */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .post-slot {
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      background: #ededf0;
      cursor: pointer;
      position: relative;
    }

    .post-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
      display: block;
    }

    .post-slot:hover img {
      transform: scale(1.06);
    }

    /* Modal Popup ดูงาน: แสดงรูปตามขนาดจริง 100% ไม่บีบรูป */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 25, 28, 0.65);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      animation: popIn 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      position: relative;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(244, 244, 246, 0.9);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: var(--pastel-dark);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* กล่องรูปภาพใน Modal: โชว์ขนาดและสัดส่วนจริงของรูป */
    .modal-img-wrap {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #f7f7f8;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img-wrap img {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      display: block;
      border-radius: 16px;
    }

    .modal-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--pastel-gray);
      white-space: pre-line;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .modal-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px;
      border-radius: 16px;
      background: var(--btn-charcoal);
      color: #ffffff;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .modal-link-btn:active {
      opacity: 0.9;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--pastel-gray);
      margin-top: 16px;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>

  <!-- Floating Emojis -->
  <div class="floating-container" id="emojiContainer"></div>

  <!-- Background Music -->
  <audio id="bgMusic" loop autoplay playsinline src="https://files.catbox.moe/zy1wnq.mp3"></audio>

  <div class="container">

    <!-- กล่องโปรไฟล์ -->
    <div class="profile-card">
      <div class="banner-container">
        <img id="mainBanner" class="banner-img" src="https://i.postimg.cc/26YfhPc1/CA378830-D049-4F10-B91D-83E369F619D9.gif" alt="Banner">
      </div>

      <div class="profile-wrap">
        <img id="mainProfile" class="profile-img" src="https://i.ibb.co/gZg1bdv9/IMG-3203.jpg" alt="Profile">
      </div>

      <h1 class="store-name" id="storeNameText">welcome to bebselris ♡</h1>
      <p class="bio-text" id="storeBioText">เชิญเลือกดูงานร้านเค้าได้เลยนะคะ
สนใจติดต่อสอบถามได้เลยค่ะ</p>

      <div>
        <a id="contactLinkBtn" href="https://lin.ee/Ql4HBD4" target="_blank" class="contact-btn">
          <span>💬</span> <span id="contactIdText">Line : @861pblyp</span>
        </a>
      </div>
    </div>

    <!-- โพสต์ตัวอย่างงานแบบสี่เหลี่ยมเล็ก (3 ช่องสไตล์ไอจี) -->
    <div class="section-card">
      <div class="section-title">📂 Portfolio & Works</div>
      <div class="posts-grid" id="postsGrid">
        <p style="text-align: center; grid-column: span 3; font-size: 12px; color: var(--pastel-gray);">กำลังโหลดตัวอย่างงาน...</p>
      </div>
    </div>

    <div class="footer-note">thank you for supporting bebseleis ♡</div>

  </div>

  <!-- Modal สำหรับกดดูโพสต์ (รูปตามขนาดจริง) -->
  <div class="modal-overlay" id="postModal">
    <div class="modal-card">
      <button type="button" class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-img-wrap">
        <img id="modalImg" src="" alt="Work Preview">
      </div>
      <div class="modal-desc" id="modalDesc">คำอธิบายงาน...</div>
      <a id="modalLink" href="#" target="_blank" class="modal-link-btn">
        🔗 เปิดดูลำดับงาน / ลิงก์ชิ้นงาน
      </a>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let floatingIcons = ['☁️', '🩶', '🎱'];

    // ดึงข้อมูลเว็บไซต์แบบ Realtime
    db.collection("bebselris_portfolio").doc("site_config").onSnapshot(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (d.banner) document.getElementById('mainBanner').src = d.banner;
        if (d.profile) document.getElementById('mainProfile').src = d.profile;
        if (d.storeName) document.getElementById('storeNameText').textContent = d.storeName;
        if (d.storeBio) document.getElementById('storeBioText').textContent = d.storeBio;

        if (d.contactId) document.getElementById('contactIdText').textContent = d.contactId;
        if (d.contactUrl) document.getElementById('contactLinkBtn').href = d.contactUrl;

        if (d.floatingIcons && d.floatingIcons.trim() !== '') {
          floatingIcons = d.floatingIcons.trim().split(/\s+/);
        }

        if (d.musicUrl) {
          const m = document.getElementById('bgMusic');
          if (m && m.src !== d.musicUrl) {
            m.src = d.musicUrl;
            m.play().catch(() => {});
          }
        }
      }
    });

    // ดึงรายการโพสต์แสดงในตาราง 3 ช่อง
    db.collection("bebselris_posts").orderBy("createdAt", "desc").onSnapshot(snapshot => {
      const grid = document.getElementById('postsGrid');
      grid.innerHTML = '';

      if (snapshot.empty) {
        grid.innerHTML = '<p style="text-align:center; grid-column:span 3; font-size:12px; color:var(--pastel-gray);">ยังไม่มีตัวอย่างงานที่ลงไว้ค่ะ ♡</p>';
        return;
      }

      snapshot.forEach(doc => {
        const item = { id: doc.id, ...doc.data() };
        const slot = document.createElement('div');
        slot.className = 'post-slot';
        slot.onclick = () => openPostModal(item);
        slot.innerHTML = `<img src="${item.imageUrl || ''}" alt="Portfolio">`;
        grid.appendChild(slot);
      });
    });

    // เปิด Modal แสดงรูปขนาดจริง
    function openPostModal(post) {
      document.getElementById('modalImg').src = post.imageUrl || '';
      document.getElementById('modalDesc').textContent = post.description || 'ไม่มีคำอธิบายเพิ่มเติมค่ะ ♡';
      
      const linkBtn = document.getElementById('modalLink');
      if (post.workUrl && post.workUrl.trim() !== '') {
        linkBtn.href = post.workUrl;
        linkBtn.style.display = 'flex';
      } else {
        linkBtn.style.display = 'none';
      }

      document.getElementById('postModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('postModal').classList.remove('active');
    }

    // Audio Autoplay
    const music = document.getElementById('bgMusic');
    function startMusic() {
      if (music.paused) music.play().catch(() => {});
    }
    window.addEventListener('DOMContentLoaded', () => {
      startMusic();
      document.body.addEventListener('click', startMusic, { once: true });
      document.body.addEventListener('touchstart', startMusic, { once: true });
    });

    // Floating Emojis
    const emojiBox = document.getElementById('emojiContainer');
    function createEmoji() {
      if (!floatingIcons || floatingIcons.length === 0) return;
      const el = document.createElement('div');
      el.className = 'float-item';
      el.textContent = floatingIcons[Math.floor(Math.random() * floatingIcons.length)];
      el.style.left = Math.random() * 92 + 'vw';
      el.style.animationDuration = (8 + Math.random() * 5) + 's';
      emojiBox.appendChild(el);
      setTimeout(() => { el.remove(); }, 14000);
    }
    setInterval(createEmoji, 1300);
  </script>
</body>
</html>
