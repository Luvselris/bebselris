<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ♡ bebselris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #f7f7f8;
      --card-bg: rgba(255, 255, 255, 0.95);
      --pastel-dark: #3a3a3e;
      --pastel-gray: #71717a;
      --border-soft: #ececf0;
      --btn-charcoal: #27272a;
      --glow-shadow: 0 10px 28px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #ffffff 0%, #f4f4f6 60%, #ebebef 100%);
      color: var(--pastel-dark);
      min-height: 100vh;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    #loginView {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 30px;
      padding: 38px 24px;
      box-shadow: var(--glow-shadow);
      border: 2px solid #ffffff;
      text-align: center;
    }

    .login-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--pastel-dark);
      margin-bottom: 20px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--pastel-gray);
      margin-bottom: 5px;
      padding-left: 4px;
      font-weight: 600;
    }

    .input-field, .textarea-field {
      width: 100%;
      padding: 11px 16px;
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      font-size: 13.5px;
      background: #ffffff;
      color: var(--pastel-dark);
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: #a1a1aa;
    }

    .btn-main {
      width: 100%;
      background: var(--btn-charcoal);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .error-text {
      color: #ef4444;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    #dashboardView {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 4px 4px;
    }

    .welcome-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--pastel-dark);
    }

    .logout-btn {
      background: #ffffff;
      color: var(--pastel-dark);
      border: 1.5px solid var(--border-soft);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 26px;
      padding: 20px 18px;
      box-shadow: var(--glow-shadow);
      border: 2px solid #ffffff;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--pastel-dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-box {
      width: 100%;
      height: 120px;
      border-radius: 16px;
      object-fit: cover;
      margin-top: 8px;
      border: 1px solid var(--border-soft);
      display: none;
      background: #f4f4f6;
    }

    .preview-circle {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      object-fit: cover;
      margin: 8px auto 0;
      border: 2px solid var(--border-soft);
      display: none;
    }

    .admin-posts-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 10px;
      padding-right: 4px;
    }

    .admin-post-item {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-post-thumb {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      object-fit: cover;
      background: #f4f4f6;
    }

    .btn-del {
      background: #fee2e2;
      color: #ef4444;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <div class="container">

    <div id="loginView">
      <div class="login-card">
        <h1 class="login-title">Admin Dashboard 🎱</h1>
        
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>email</label>
            <input type="email" id="emailInput" class="input-field" placeholder="srezinalm@gmail.com" required>
          </div>

          <div class="form-group">
            <label>password</label>
            <input type="password" id="passwordInput" class="input-field" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-main">เข้าสู่ระบบ</button>
          <p id="loginError" class="error-text">อีเมลหรือรหัสผ่านไม่ถูกต้องค่ะ</p>
        </form>
      </div>
    </div>

    <div id="dashboardView">
      <div class="top-bar">
        <div class="welcome-text">bebselris Manager ♡</div>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>

      <!-- ส่วนที่ 1: แบนเนอร์ & โปรไฟล์ -->
      <div class="panel-card">
        <div class="panel-title">🖼 แบนเนอร์ & โปรไฟล์</div>

        <div class="form-group">
          <label>ลิงก์รูปแบนเนอร์ GIF / Image (ขนาดตามจริง)</label>
          <input type="text" id="bannerUrlInput" class="input-field" placeholder="https://...gif หรือ .png" oninput="previewBanner(this.value)">
          <img id="bannerPrev" class="preview-box" alt="Banner Preview">
        </div>

        <div class="form-group">
          <label>หรือเลือกอัปโหลดแบนเนอร์จากเครื่อง</label>
          <input type="file" accept="image/*" class="input-field" onchange="uploadImageDirect(this, 'banner')">
        </div>

        <hr style="border:none; border-top:1px dashed var(--border-soft); margin:16px 0;">

        <div class="form-group">
          <label>ลิงก์รูปโปรไฟล์ GIF / Image</label>
          <input type="text" id="profileUrlInput" class="input-field" placeholder="https://...gif หรือ .png" oninput="previewProfile(this.value)">
          <img id="profilePrev" class="preview-circle" alt="Profile Preview">
        </div>

        <div class="form-group">
          <label>หรือเลือกอัปโหลดโปรไฟล์จากเครื่อง</label>
          <input type="file" accept="image/*" class="input-field" onchange="uploadImageDirect(this, 'profile')">
        </div>
      </div>

      <!-- ส่วนที่ 2: ข้อมูลร้าน & ลูกเล่น -->
      <div class="panel-card">
        <div class="panel-title">📝 ข้อความร้าน, ลูกเล่น & เพลง</div>

        <div class="form-group">
          <label>ชื่อร้าน / หัวข้อ</label>
          <input type="text" id="storeNameInput" class="input-field" placeholder="welcome to bebselris ♡">
        </div>

        <div class="form-group">
          <label>คำอธิบายร้าน</label>
          <textarea id="storeBioInput" class="textarea-field" rows="3" placeholder="เชิญเลือกดูงาน..."></textarea>
        </div>

        <div class="form-group">
          <label>ข้อความปุ่มติดต่อ</label>
          <input type="text" id="contactIdInput" class="input-field" placeholder="Line : @861pblyp">
        </div>

        <div class="form-group">
          <label>ลิงก์ URL ช่องทางการติดต่อ</label>
          <input type="url" id="contactUrlInput" class="input-field" placeholder="https://lin.ee/Ql4HBD4">
        </div>

        <div class="form-group">
          <label>ลูกเล่นอีโมจิลอยไปมา (เว้นวรรคระหว่างตัว เช่น ☁️ 🩶 🎱)</label>
          <input type="text" id="floatingIconsInput" class="input-field" placeholder="☁️ 🩶 🎱">
        </div>

        <div class="form-group">
          <label>ลิงก์เพลงพื้นหลัง (.mp3)</label>
          <input type="url" id="musicUrlInput" class="input-field" placeholder="https://files.catbox.moe/zy1wnq.mp3">
        </div>

        <button type="button" class="btn-main" id="saveConfigBtn" onclick="saveSiteConfig()">
          ☁️ บันทึกการเปลี่ยนแปลงหน้าเว็บ ♡
        </button>
      </div>

      <!-- ส่วนที่ 3: เพิ่มโพสต์งานใหม่ตามขนาดจริง -->
      <div class="panel-card">
        <div class="panel-title">➕ เพิ่มโพสต์ตัวอย่างงานใหม่ (ขนาดจริง)</div>

        <div class="form-group">
          <label>ลิงก์รูปงาน (หรือ GIF) - แนะนำใช้ลิงก์เพื่อภาพขนาดเต็ม 100%</label>
          <input type="text" id="newPostUrl" class="input-field" placeholder="https://... ลิงก์รูปภาพหรือ GIF">
        </div>

        <div class="form-group">
          <label>หรืออัปโหลดรูปงานจากเครื่อง</label>
          <input type="file" id="newPostFile" accept="image/*" class="input-field" onchange="uploadPostImage(this)">
        </div>

        <div class="form-group">
          <label>คำอธิบายงาน (แสดงตอนกดเข้าไปดู)</label>
          <textarea id="newPostDesc" class="textarea-field" rows="2" placeholder="รายละเอียดของงานชิ้นนี้..."></textarea>
        </div>

        <div class="form-group">
          <label>ลิงก์ผลงาน (ถ้ามีให้กดไปดูต่อ)</label>
          <input type="url" id="newPostWorkUrl" class="input-field" placeholder="https://... ลิงก์ชิ้นงาน">
        </div>

        <button type="button" class="btn-main" id="addPostBtn" onclick="submitNewPost()">
          + เพิ่มโพสต์ลงเว็บ ♡
        </button>
      </div>

      <!-- ส่วนที่ 4: จัดการโพสต์ทั้งหมด -->
      <div class="panel-card">
        <div class="panel-title">📂 โพสต์งานทั้งหมดในเว็บ (กดลบได้)</div>
        <div class="admin-posts-list" id="adminPostsList">
          <p style="text-align:center; font-size:12px; color:var(--pastel-gray);">กำลังโหลด...</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const AUTH_EMAIL = "srezinalm@gmail.com";
    const AUTH_PASS = "@Natthanan2911";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let siteConfig = {
      banner: "https://i.postimg.cc/26YfhPc1/CA378830-D049-4F10-B91D-83E369F619D9.gif",
      profile: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg",
      storeName: "welcome to bebselris ♡",
      storeBio: "เชิญเลือกดูงานร้านเค้าได้เลยนะคะ\nสนใจติดต่อสอบถามได้เลยค่ะ",
      contactId: "Line : @861pblyp",
      contactUrl: "https://lin.ee/Ql4HBD4",
      floatingIcons: "☁️ 🩶 🎱",
      musicUrl: "https://files.catbox.moe/zy1wnq.mp3"
    };

    let tempPostBase64 = "";

    window.onload = function() {
      if (sessionStorage.getItem('bebselris_auth_v2') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const pass = document.getElementById('passwordInput').value.trim();
      const err = document.getElementById('loginError');

      if (email === AUTH_EMAIL && pass === AUTH_PASS) {
        sessionStorage.setItem('bebselris_auth_v2', 'true');
        err.style.display = 'none';
        showDashboard();
      } else {
        err.style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('bebselris_auth_v2');
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'flex';
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      try {
        const doc = await db.collection("bebselris_portfolio").doc("site_config").get();
        if (doc.exists) {
          siteConfig = { ...siteConfig, ...doc.data() };
        }
      } catch (err) {
        console.error(err);
      }

      renderConfig();
      listenPosts();
    }

    function renderConfig() {
      document.getElementById('bannerUrlInput').value = siteConfig.banner || '';
      previewBanner(siteConfig.banner);

      document.getElementById('profileUrlInput').value = siteConfig.profile || '';
      previewProfile(siteConfig.profile);

      document.getElementById('storeNameInput').value = siteConfig.storeName || '';
      document.getElementById('storeBioInput').value = siteConfig.storeBio || '';
      document.getElementById('contactIdInput').value = siteConfig.contactId || '';
      document.getElementById('contactUrlInput').value = siteConfig.contactUrl || '';
      document.getElementById('floatingIconsInput').value = siteConfig.floatingIcons || '☁️ 🩶 🎱';
      document.getElementById('musicUrlInput').value = siteConfig.musicUrl || '';
    }

    function previewBanner(url) {
      const img = document.getElementById('bannerPrev');
      if (url && url.trim() !== '') {
        img.src = url;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    }

    function previewProfile(url) {
      const img = document.getElementById('profilePrev');
      if (url && url.trim() !== '') {
        img.src = url;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    }

    // เก็บภาพคุณภาพสูงตามจริง
    function compressImage(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function uploadImageDirect(input, key) {
      if (input.files && input.files[0]) {
        compressImage(input.files[0], 1200, 0.85, function(base64) {
          siteConfig[key] = base64;
          if (key === 'banner') {
            document.getElementById('bannerUrlInput').value = '';
            previewBanner(base64);
          } else {
            document.getElementById('profileUrlInput').value = '';
            previewProfile(base64);
          }
        });
      }
    }

    async function saveSiteConfig() {
      const btn = document.getElementById('saveConfigBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกข้อมูล... ⏳';

      const bannerInputVal = document.getElementById('bannerUrlInput').value.trim();
      if (bannerInputVal) siteConfig.banner = bannerInputVal;

      const profileInputVal = document.getElementById('profileUrlInput').value.trim();
      if (profileInputVal) siteConfig.profile = profileInputVal;

      siteConfig.storeName = document.getElementById('storeNameInput').value.trim();
      siteConfig.storeBio = document.getElementById('storeBioInput').value.trim();
      siteConfig.contactId = document.getElementById('contactIdInput').value.trim();
      siteConfig.contactUrl = document.getElementById('contactUrlInput').value.trim();
      siteConfig.floatingIcons = document.getElementById('floatingIconsInput').value.trim() || '☁️ 🩶 🎱';
      siteConfig.musicUrl = document.getElementById('musicUrlInput').value.trim();

      try {
        await db.collection("bebselris_portfolio").doc("site_config").set(siteConfig);
        alert('✨ บันทึกข้อมูลและลูกเล่นขึ้นระบบสำเร็จ หน้าเว็บเปลี่ยนทันทีค่ะ!');
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึกค่ะ');
      } finally {
        btn.disabled = false;
        btn.textContent = '☁️ บันทึกการเปลี่ยนแปลงหน้าเว็บ ♡';
      }
    }

    function uploadPostImage(input) {
      if (input.files && input.files[0]) {
        // เพิ่มความกว้างสูงสุดเป็น 1200px ให้ภาพคมชัดขนาดใหญ่ตามจริง
        compressImage(input.files[0], 1200, 0.85, function(base64) {
          tempPostBase64 = base64;
          document.getElementById('newPostUrl').value = '';
        });
      }
    }

    async function submitNewPost() {
      const urlInput = document.getElementById('newPostUrl').value.trim();
      const desc = document.getElementById('newPostDesc').value.trim();
      const workUrl = document.getElementById('newPostWorkUrl').value.trim();
      const btn = document.getElementById('addPostBtn');

      const imgToSave = urlInput || tempPostBase64;
      if (!imgToSave) {
        alert('กรุณาใส่ลิงก์รูป หรือเลือกไฟล์รูปภาพก่อนนะคะ ♡');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังเพิ่มโพสต์... ⏳';

      try {
        await db.collection("bebselris_posts").add({
          imageUrl: imgToSave,
          description: desc,
          workUrl: workUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('newPostUrl').value = '';
        document.getElementById('newPostFile').value = '';
        document.getElementById('newPostDesc').value = '';
        document.getElementById('newPostWorkUrl').value = '';
        tempPostBase64 = '';

        alert('✨ เพิ่มโพสต์ลงเว็บเรียบร้อยแล้วค่ะ!');
      } catch (e) {
        alert('เกิดข้อผิดพลาดในการเพิ่มโพสต์ค่ะ');
      } finally {
        btn.disabled = false;
        btn.textContent = '+ เพิ่มโพสต์ลงเว็บ ♡';
      }
    }

    function listenPosts() {
      db.collection("bebselris_posts").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        const list = document.getElementById('adminPostsList');
        list.innerHTML = '';

        if (snapshot.empty) {
          list.innerHTML = '<p style="text-align:center; font-size:12px; color:var(--pastel-gray);">ยังไม่มีโพสต์ในระบบ</p>';
          return;
        }

        snapshot.forEach(doc => {
          const item = doc.data();
          const div = document.createElement('div');
          div.className = 'admin-post-item';
          div.innerHTML = `
            <img src="${item.imageUrl}" class="admin-post-thumb">
            <div style="flex:1; overflow:hidden;">
              <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${item.description || '(ไม่มีคำอธิบาย)'}
              </div>
              <div style="font-size:11px; color:var(--pastel-gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${item.workUrl || 'ไม่มีลิงก์งาน'}
              </div>
            </div>
            <button class="btn-del" onclick="deletePost('${doc.id}')">ลบ</button>
          `;
          list.appendChild(div);
        });
      });
    }

    async function deletePost(id) {
      if (confirm('ต้องการลบโพสต์งานนี้ใช่หรือไม่คะ? 🗑️')) {
        try {
          await db.collection("bebselris_posts").doc(id).delete();
        } catch (e) {
          console.error(e);
        }
      }
    }
  </script>
</body>
</html>
